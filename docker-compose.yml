version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecodenuncia-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecodenuncia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Erro: defina POSTGRES_PASSWORD no .env ou variável de ambiente}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecodenuncia-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecodenuncia}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD?Erro: defina POSTGRES_PASSWORD no .env ou variável de ambiente}
      CORS_ORIGINS: ${CORS_ORIGINS:*}
      PORT: 8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  postgres_data: