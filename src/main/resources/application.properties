spring.application.name=backend
server.port=${PORT:8080}

# Credenciais vêm de variáveis de ambiente (Railway -> Variables). NUNCA coloque a senha aqui.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# DDL auto: 'update' para dev local, 'validate' para produção (evita alterações automáticas de schema)
# Defina via SPRING_PROFILES_ACTIVE=prod ou variável de ambiente SPRING_JPA_HIBERNATE_DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Upload de foto
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Validação
spring.jpa.properties.jakarta.persistence.validation.mode=auto

# Origens permitidas no CORS (separadas por vírgula). Ex.: https://seusite.com
# AVISO: Em produção, NÃO use *. Configure domínios específicos.
app.cors.allowed-origins=${CORS_ORIGINS:*}

# Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
